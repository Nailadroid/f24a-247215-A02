<!DOCTYPE html>
<html>
<head>

</head>
<body>

    <button id="find">Find</button>
    <input id="name">
    <p id="card"></p>
    <p id="times">Times</p>
    <ul id="slip"></ul>

    <script>
        var count = 0;

        var btn = document.getElementById("find");
        var timesDisplay = document.getElementById("times");

        btn.onclick = function() {
            count = count + 1;
            timesDisplay.innerHTML = count;
        };
    </script>

</body>
