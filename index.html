<!DOCTYPE html>
<html>
<head>
    <title>Lab Assignment - 247215</title>
</head>
<body>

    <button id="find">Find</button>
    <input id="name">
    <p id="card"></p>
    <p id="times">Times</p>
    <ul id="slip"></ul>

    <script>
       
        var serverData = {
            pen: 50
        };

        var count = 0;

        var btn = document.getElementById("find");
        var inputBox = document.getElementById("name");
        var cardDisplay = document.getElementById("card");
        var timesDisplay = document.getElementById("times");
        var slipList = document.getElementById("slip");

        btn.onclick = function() {
         
            count = count + 1;

            timesDisplay.innerHTML = count;

            var itemName = inputBox.value;

            if (serverData[itemName]) {
              
                cardDisplay.innerHTML = serverData[itemName];

                var li = document.createElement("li");
                li.innerHTML = itemName;

                slipList.appendChild(li);
            }
        };
    </script>

</body>
</html>
